
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>EMPLOYEES MANAGEMENT SYSTEM DEVELOPED BY RAKHIABI</h1>
            <p>Manage your employees efficiently</p>
        </header>

        <section class="form-section">
            <h2 id="formTitle">Add Employee</h2>

            <form id="employeeForm">
                <input type="hidden" id="employeeId">

                <div class="form-grid">
                    <input type="text" id="name" placeholder="Employee Name" required>
                    <input type="email" id="email" placeholder="Email Address" required>
                    <input type="text" id="phone" placeholder="Phone Number">
                    <input type="text" id="department" placeholder="Department" required>
                    <input type="text" id="designation" placeholder="Designation" required>
                    <input type="number" id="salary" placeholder="Salary" min="0" step="0.01" required>
                </div>

                <button type="submit" id="submitBtn">Add Employee</button>
                <button type="button" id="cancelBtn" class="cancel" hidden>Cancel Edit</button>
            </form>
        </section>

        <section class="employee-section">
            <div class="employee-heading">
                <h2>Employee List</h2>
                <input type="text" id="searchInput" placeholder="Search employees...">
            </div>

            <p id="message"></p>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Department</th>
                            <th>Designation</th>
                            <th>Salary</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="employeeTable">
                        <tr>
                            <td colspan="8">Loading employees...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
